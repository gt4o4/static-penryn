# Strict typing for the whole tree, with no Any: not written, not inferred
# from an untyped call, not imported from an untyped library and not hidden
# behind a decorator. pyelftools and pwntools ship no annotations; the stubs
# under typings/ describe exactly the parts of them this code uses.
[mypy]
python_version = 3.13
files = static_penryn, tests
mypy_path = typings
strict = True
disallow_any_expr = True
disallow_any_explicit = True
disallow_any_decorated = True
disallow_any_unimported = True
warn_unreachable = True
strict_bytes = True
local_partial_types = True
enable_error_code = ignore-without-code, redundant-expr, truthy-bool, truthy-iterable, possibly-undefined, redundant-self, mutable-override, unimported-reveal
